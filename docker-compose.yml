# squallscale — one-command local fleet.
#
#   docker compose up --build
#
# Brings up two C++ backends behind an nginx load balancer, reachable at
# http://localhost:8088. In the elasticity milestone a controller takes over
# and grows or shrinks the backend set on its own.

services:
  backend1:
    build: ./backend
    image: squallscale-backend:local
    environment:
      WORK_MS: "${WORK_MS:-40}"
      THREADS: "${THREADS:-8}"
    networks: [squallscale]

  backend2:
    build: ./backend
    image: squallscale-backend:local
    environment:
      WORK_MS: "${WORK_MS:-40}"
      THREADS: "${THREADS:-8}"
    networks: [squallscale]

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
    networks: [squallscale]

networks:
  squallscale:
    name: squallscale
