# Seed load-balancer config for the static two-backend fleet.
# In the elasticity milestone the controller regenerates this upstream block
# live as backends come and go, and reloads nginx without dropping requests.

upstream backend_servers {
    server backend1:8080 max_fails=3 fail_timeout=5s;
    server backend2:8080 max_fails=3 fail_timeout=5s;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend_servers;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        # Passive health checks: step over a backend that errors or times out.
        proxy_next_upstream error timeout http_502 http_503;
        # Surface which backend served the request (handy for the dashboard).
        add_header X-Backend $upstream_addr always;
    }
}
