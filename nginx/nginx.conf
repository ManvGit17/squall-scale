# A single worker keeps round-robin deterministic at this scale: nginx
# balances per worker, so many workers would each start their own rotation.
# One worker easily outpaces the C++ backends.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
